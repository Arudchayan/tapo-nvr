[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tapo-nvr"
version = "1.1.0"
description = "Private RTSP relay, laptop recorder, and SD-card backup for TP-Link Tapo cameras and Frigate NVRs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Arudchayan", email = "arudchayan01@gmail.com" }]
keywords = [
  "frigate",
  "nvr",
  "rtsp",
  "tailscale",
  "tapo",
  "camera",
  "self-hosted",
  "google-drive",
  "backup",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: System :: Networking",
]
dependencies = ["paramiko>=3.4,<6"]

[project.optional-dependencies]
sync = ["pytapo>=3.4.20,<4; python_version >= '3.11'"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "pytapo>=3.4.20,<4; python_version >= '3.11'",
]

[project.scripts]
tapo-nvr = "tapo_nvr.cli:main"

[project.urls]
Homepage = "https://github.com/Arudchayan/tapo-nvr"
Repository = "https://github.com/Arudchayan/tapo-nvr"
Issues = "https://github.com/Arudchayan/tapo-nvr/issues"
Changelog = "https://github.com/Arudchayan/tapo-nvr/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tapo_nvr"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["tapo_nvr"]

[tool.coverage.report]
show_missing = true
