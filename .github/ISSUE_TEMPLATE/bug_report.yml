name: Bug report
description: Report a problem with tapo-nvr
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please **redact secrets** before posting:
        camera credentials, `.env` contents, Tailscale addresses, and
        unredacted `rtsp://user:password@host` URLs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run `tapo-nvr deploy`
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tapo-nvr version
      description: Output of `tapo-nvr --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Relay host platform
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted relay logs, `tapo-nvr inspect` output, or container logs.
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Camera model, Frigate version, Tailscale setup, anything else relevant.
    validations:
      required: false
